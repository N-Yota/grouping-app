<!-- templates/index.html -->
<!DOCTYPE html>
<html>
<head>
    <title>グループ分けツール</title>
</head>
<body>
    <h1>Excel URLでグループ分け</h1>
    <form method="POST">
        <label for="url">ExcelファイルのURL:</label><br>
        <input type="text" id="url" name="url" size="60" required><br><br>
        <button type="submit">実行する</button>
    </form>

    {% if result %}
        <h2>グループ分け結果</h2>
        <pre>{{ result }}</pre>
    {% endif %}
</body>
</html>
